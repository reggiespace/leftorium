server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # HashRouter means every real route is "/" as far as the server is
    # concerned (the part after # never reaches nginx), so no SPA rewrite
    # rules are needed beyond the default index.html fallback below.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Regenerated at container start by docker-entrypoint.sh — must never
    # be cached, or a redeploy with a changed VITE_STRAPI_URL won't take
    # effect for returning visitors.
    location = /env-config.js {
        add_header Cache-Control "no-store, must-revalidate";
        expires off;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
